@font-face{font-family:"Alexandria";font-weight:500;font-display:swap;src:url(fonts/alexandria-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Alexandria";font-weight:700;font-display:swap;src:url(fonts/alexandria-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Alexandria";font-weight:500;font-display:swap;src:url(fonts/alexandria-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Alexandria";font-weight:700;font-display:swap;src:url(fonts/alexandria-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}

:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --surface2:#EFE9DE; --surface3:#E6DED0;
  --line:#E4DCCD; --line2:#D6CCBA; --track:#ECE5D8;
  --ink:#1F1B15; --mute:#6F675B; --dim:#A0978A;
  --brand:#E8590C; --brand-d:#B8460A; --brand-soft:#FDE8DA;
  --green:#2F9E44; --green-d:#22792F; --green-soft:#E3F4E6;
  --gold:#E8A100; --gold-soft:#FFF3D1;
  --red:#D9363E; --red-soft:#FCE4E4;
  --blue:#1C7ED6; --blue-soft:#E1EEFB;
  --scrim:rgba(31,27,21,.45);
  --r:16px; --r2:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.9,.3,1.1);
  --head:"Alexandria","Plex Arabic",system-ui,sans-serif;
  --body:"Plex Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130F; --surface:#1F1C17; --surface2:#29251F; --surface3:#332E27;
  --line:#2F2A23; --line2:#3D372E; --track:#2C2720;
  --ink:#F3EEE6; --mute:#A79F92; --dim:#6F685D;
  --brand:#F2711C; --brand-d:#B4510F; --brand-soft:#3A2416;
  --green:#40C057; --green-d:#2B8A3E; --green-soft:#1C3322;
  --gold:#FAB005; --gold-soft:#3A3014; --red:#FA5252; --red-soft:#3B1D1D; --blue:#4DABF7; --blue-soft:#172A3B;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;font-size:15px}
h1,h2,h3,h4,.head{font-family:var(--head);font-weight:700;letter-spacing:0}
input,textarea,button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:relative;max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 110px)}

/* chunky "game" buttons: solid color + bottom edge */
.chunky{background:var(--brand);color:#fff;border-radius:14px;box-shadow:0 4px 0 var(--brand-d);transition:transform .08s,box-shadow .08s}
.chunky:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .hello{flex:1;min-width:0}
.top h1{font-size:23px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date{color:var(--mute);font-size:13px;margin-top:1px}
.chip-streak{display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-family:var(--head);font-weight:700;font-size:15px}
.chip-streak svg{width:18px;height:18px}
.chip-streak.cold{background:var(--surface2);color:var(--dim)}
.chip-add{height:40px;padding:0 14px;font-family:var(--head);font-weight:700;font-size:14px}
.lvl-av{position:relative;width:44px;height:44px;flex:none}
.lvl-av svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl-av .face{position:absolute;inset:5px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px}
.lvl-av .n{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:99px;border:2px solid var(--bg);line-height:1.5}

/* ---------- coach ---------- */
.coach{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px}
.coach .who{width:40px;height:40px;flex:none;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:21px}
.coach .bubble{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:11px 14px;font-size:15px;line-height:1.65;cursor:pointer}
.coach .bubble small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}

/* ---------- day card ---------- */
.daycard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{position:relative;width:80px;height:80px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:700;font-size:19px;line-height:1}
.ring .v small{display:block;font-family:var(--body);font-size:10.5px;color:var(--mute);font-weight:400;margin-top:4px}
.daycard .txt{flex:1;min-width:0}
.daycard .txt b{font-family:var(--head);font-size:17px}
.daycard .txt p{color:var(--mute);font-size:13px;margin-top:3px}
.xpbar{height:10px;background:var(--track);border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .8s var(--ease)}
.xpline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:5px}

/* ---------- day strip ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 6px}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:52px;padding:8px 0 7px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:center;transition:.15s}
.dpill .w{font-size:11px;color:var(--mute)}
.dpill .d{font-family:var(--head);font-size:17px;font-weight:700;margin-top:1px}
.dpill .dots{height:6px;display:flex;justify-content:center;gap:2px;margin-top:3px}
.dpill .dots i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.dpill .dots i.ok{background:var(--green)}
.dpill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dpill.on .w{color:var(--bg);opacity:.75}
.dpill.on .dots i{background:var(--bg);opacity:.6}.dpill.on .dots i.ok{background:var(--green);opacity:1}

/* ---------- sections + task cards ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h3{font-size:14px;color:var(--mute);display:flex;gap:7px;align-items:center;font-weight:500}
.sec .cnt{font-family:var(--body);font-size:12px;background:var(--surface2);padding:0 8px;border-radius:99px;color:var(--ink);font-weight:600}
.sec button{font-size:13px;color:var(--brand);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.task{position:relative;border-radius:var(--r);touch-action:pan-y}
.task .under{position:absolute;inset:0;border-radius:var(--r);font-weight:600;font-size:14px;overflow:hidden}
.task .under .l,.task .under .r{opacity:0;transition:opacity .15s;top:50%;transform:translateY(-50%)}
.task .under.done{background:var(--green);color:#fff}
.task .under.snz{background:var(--gold);color:#fff}
.task .card{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;transition:transform .3s var(--ease),opacity .3s;will-change:transform}
.task .card:active{background:var(--surface2)}
.task .emo{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--surface2)}
.task .body{flex:1;min-width:0}
.task .ttl{font-size:15.5px;font-weight:500;line-height:1.5;word-break:break-word}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:7px;background:var(--surface2);color:var(--mute);display:inline-flex;gap:4px;align-items:center;font-weight:500}
.tag.time{color:var(--ink)}
.tag.late{color:var(--red);background:var(--red-soft)}
.tag.big{color:var(--gold);background:var(--gold-soft)}
.tag.rep{color:var(--blue);background:var(--blue-soft)}
.tag.hi{color:#fff;background:var(--red)}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;width:100%}
.pr{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);transition:transform .15s var(--ease)}
.pr:active{transform:scale(.94)}
.pr b{font-size:13px;font-weight:600}
.pr small{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pr.next{border-color:var(--brand);background:var(--brand-soft)}
.pr.next small{color:var(--brand-d);font-weight:600}
.pr.on{background:var(--green);border-color:var(--green);color:#fff}
.pr.on small{color:#fff;opacity:.85}
.pr.missed small{color:var(--red)}
.goal:has(.prayers){flex-wrap:wrap}
.prloc{display:block;margin-top:8px;font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;width:100%;text-align:start}
.task.hi .card{border-inline-start:4px solid var(--red)}
.task .notes,.rcard .notes{font-size:13px;color:var(--mute);line-height:1.6;margin-top:6px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard .notes{-webkit-line-clamp:6}
.rcard.upd .t{font-size:16px;font-weight:500}
button.tag{border:0;cursor:pointer}
.field textarea{height:auto;min-height:84px;padding:12px 14px;line-height:1.6;resize:vertical}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:.2s var(--ease);background:var(--surface)}
.chk svg{opacity:0;transform:scale(.4);transition:.25s var(--ease);stroke:#fff}
.task.is-done .chk{background:var(--green);border-color:var(--green)}
.task.is-done .chk svg{opacity:1;transform:scale(1)}
.task.is-done .card{opacity:.6}
.task.is-done .ttl{text-decoration:line-through;color:var(--mute)}
.task.overdue .card{border-color:var(--red);border-inline-start-width:4px}
.task.now .card{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.task.pop .card{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.task.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mini-steps{margin-top:7px;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.mini-steps i{display:block;height:100%;background:var(--gold);border-radius:99px}

.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.nudge .e{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;flex:none}
.nudge .t{flex:1;font-size:14px;line-height:1.55}
.nudge .t small{color:var(--mute)}
.nudge button{padding:0 12px;height:38px;font-size:13px;font-weight:600;white-space:nowrap}

.empty{text-align:center;padding:30px 20px;border:2px dashed var(--line2);border-radius:var(--r2);color:var(--mute);line-height:1.7}
.empty .big{font-size:40px;margin-bottom:4px}
.empty b{color:var(--ink);display:block;font-family:var(--head);font-size:16px;margin-bottom:4px}
.empty .ex{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;color:var(--ink)}

/* ---------- goals ---------- */
.goal{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r2);padding:14px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.goal .gl{flex:1;min-width:0}
.goal h4{font-size:16px}
.goal p{font-size:13px;color:var(--mute);margin-top:2px}
.goal .dots{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.goal .dots i{width:16px;height:16px;border-radius:5px;background:var(--track);transition:.25s var(--ease)}
.goal .dots i.on{background:var(--brand)}
.goal .plus{width:54px;height:54px;flex:none;border-radius:16px;font-size:26px;font-weight:700;display:grid;place-items:center;position:relative;overflow:hidden}
.goal.complete .plus{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.goal.complete .dots i.on{background:var(--green)}
.goal .ring{width:58px;height:58px}
.goal .ring .v{font-size:22px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:right;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.tpl:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tpl .e{font-size:26px}
.tpl b{display:block;font-family:var(--head);font-size:14px;margin-top:6px}
.tpl small{color:var(--mute);font-size:12px}

/* ---------- people ---------- */
.person{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:12px}
.person .av{width:50px;height:50px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface2);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--st,var(--green))}
.person .pl{flex:1;min-width:0}
.person h4{font-size:16px}
.person p{font-size:12.5px;color:var(--mute);margin-top:2px}
.person .warm{height:6px;border-radius:99px;background:var(--track);margin-top:8px;overflow:hidden}
.person .warm i{display:block;height:100%;border-radius:99px;background:var(--st,var(--green));transition:width .6s var(--ease)}
.person .called{height:40px;padding:0 12px;border-radius:12px;background:var(--green);box-shadow:0 3px 0 var(--green-d);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.person .called:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}

/* ---------- me ---------- */
.hero{text-align:center;padding:22px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r2)}
.hero .bigav{width:104px;height:104px;margin:0 auto 10px;position:relative}
.hero .bigav .face{position:absolute;inset:10px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:42px}
.hero .bigav svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero h2{font-size:22px}
.hero .title{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--head);font-size:22px;font-weight:700;display:flex;gap:6px;align-items:center}
.stat .l{font-size:12.5px;color:var(--mute);margin-top:2px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;direction:ltr;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;overflow-x:auto;justify-content:start}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--track)}
.heat i.l1{background:#FFD8A8}.heat i.l2{background:#FFA94D}.heat i.l3{background:var(--brand)}.heat i.l4{background:var(--brand-d)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.badge .e{font-size:28px}
.badge b{display:block;font-size:12.5px;margin-top:4px;font-weight:600}
.badge small{display:block;font-size:11px;color:var(--mute);margin-top:1px;line-height:1.4}
.badge.locked .e{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--dim)}
.badge.got{border-color:var(--gold);background:var(--gold-soft)}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;text-align:right;font-size:15px;margin-bottom:8px}
.rowbtn .e{font-size:18px;width:24px;text-align:center}
.rowbtn span{flex:1}
.rowbtn small{color:var(--mute);font-size:12.5px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 6px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;text-align:center;line-height:1.5}
.seg button .e{display:block;font-size:24px}
.seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}

/* ---------- nav + fab ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-around;padding:8px 8px calc(var(--sab) + 8px);background:var(--surface);border-top:1.5px solid var(--line)}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0;font-weight:500}
.nav .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .tab.on{color:var(--brand)}
.fab{width:64px;height:64px;margin-top:-26px;flex:none;border-radius:50%;background:var(--brand);display:grid;place-items:center;box-shadow:0 5px 0 var(--brand-d);border:4px solid var(--surface);transition:transform .08s,box-shadow .08s;box-sizing:content-box}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.fab svg{width:28px;height:28px}

/* ---------- voice overlay ---------- */
.voice{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 24px);opacity:0;pointer-events:none;transition:opacity .25s}
.voice.open{opacity:1;pointer-events:auto}
.voice .x{position:absolute;top:calc(var(--sat) + 14px);left:16px;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font-size:18px}
.voice .hint{color:var(--mute);font-size:15px;margin-top:44px;text-align:center;min-height:48px;transition:opacity .4s;line-height:1.6;padding:0 30px}
.voice .hint b{color:var(--ink);font-weight:500}
#orb{width:min(70vw,280px);height:min(70vw,280px);margin:14px 0 4px;cursor:pointer}
.voice .live{font-size:21px;line-height:1.7;text-align:center;min-height:110px;max-height:30vh;overflow:auto;width:100%;padding:0 6px;font-weight:500}
.voice .live .interim{color:var(--dim)}
.voice .state{font-size:13px;color:var(--brand);margin-top:4px;height:20px;font-weight:600}
.voice .ctrls{margin-top:auto;display:flex;gap:18px;align-items:center;justify-content:center;width:100%}
.vbtn{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px;border:1.5px solid var(--line)}
.vbtn.main{width:76px;height:76px;background:var(--brand);border:0;color:#fff;font-size:26px;box-shadow:0 5px 0 var(--brand-d)}
.vbtn.main:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.vbtn.main.rec{background:var(--red);box-shadow:0 5px 0 #9e2229}
.typebox{width:100%;display:none;gap:8px;margin-top:10px}
.typebox.show{display:flex}
.typebox textarea{flex:1;min-height:56px;max-height:140px;resize:none;border-radius:16px;border:1.5px solid var(--line2);background:var(--surface);padding:14px 16px;font-size:16px;outline:none;line-height:1.5}
.typebox textarea:focus{border-color:var(--brand)}
.typebox button{width:56px;border-radius:16px;font-size:22px}

.review{width:100%;flex:1;overflow:auto;display:none;flex-direction:column;gap:10px;padding:8px 2px 14px;margin-top:8px}
.review.show{display:flex}
.review .said{font-size:14px;color:var(--mute);background:var(--surface2);border-radius:14px;padding:10px 12px;line-height:1.6}
.review .reply{font-family:var(--head);font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;line-height:1.5}
.rcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;animation:fly .45s var(--ease) both}
@keyframes fly{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.rcard .emo{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:21px;flex:none}
.rcard .b{flex:1;min-width:0}
.rcard input.t{width:100%;background:transparent;border:0;outline:none;font-size:16px;font-weight:500;padding:2px 0;border-bottom:1.5px dashed transparent}
.rcard input.t:focus{border-bottom-color:var(--line2)}
.rcard .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rcard .meta label{position:relative}
.rcard .meta input[type=date],.rcard .meta input[type=time]{position:absolute;inset:0;opacity:0;width:100%}
.rcard .del{width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red);font-size:15px;flex:none}
.review-actions{display:none;gap:10px;width:100%}
.review-actions.show{display:flex}
.btn{flex:1;height:54px;border-radius:14px;background:var(--surface);font-weight:600;font-size:16px;border:1.5px solid var(--line2);box-shadow:0 3px 0 var(--line2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.btn.pri{background:var(--brand);color:#fff;border:0;box-shadow:0 4px 0 var(--brand-d)}
.btn.pri:active{box-shadow:0 1px 0 var(--brand-d)}
.btn.ghost{background:transparent;box-shadow:none}
.thinking{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:20px;color:var(--mute)}
.thinking.show{display:flex}
.dotsl{display:inline-flex;gap:6px}.dotsl i{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:dl 1s infinite}
.dotsl i:nth-child(2){animation-delay:.15s}.dotsl i:nth-child(3){animation-delay:.3s}
@keyframes dl{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:min(520px,100%);max-height:88vh;overflow:auto;transform:translate(-50%,105%);transition:transform .38s var(--ease);background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--sab) + 20px)}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px;cursor:pointer}
.sheet h2{font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:8px;line-height:1.4}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);outline:none;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--brand)}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.act{height:50px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line2);box-shadow:0 3px 0 var(--line2);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.act.pri{background:var(--brand);color:#fff;border:0;box-shadow:0 4px 0 var(--brand-d);font-weight:600}
.act.warn{color:var(--red)}
.act.full{grid-column:1/-1}
.steps{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.step{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.step .c{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.step.d .c{background:var(--green);border-color:var(--green)}
.step.d span{text-decoration:line-through;color:var(--mute)}
.step span{flex:1;font-size:14px}
.step small{color:var(--mute);font-size:11.5px}
.emoji-pick{display:flex;gap:6px;flex-wrap:wrap}
.emoji-pick button{width:42px;height:42px;border-radius:12px;background:var(--surface);font-size:20px;border:1.5px solid var(--line)}
.emoji-pick button.on{border-color:var(--brand);background:var(--brand-soft)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{padding:8px 13px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}

/* ---------- focus ---------- */
.focus{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;opacity:0;pointer-events:none;transition:opacity .3s}
.focus.open{opacity:1;pointer-events:auto}
.focus .ft{font-family:var(--head);font-size:20px;font-weight:700;text-align:center;line-height:1.5}
.focus .fs{color:var(--mute);font-size:14.5px;text-align:center;line-height:1.6}
.focus .clock{position:relative;width:240px;height:240px}
.focus .clock svg{transform:rotate(-90deg)}
.focus .clock .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:50px;font-weight:500;direction:ltr;font-variant-numeric:tabular-nums}
.focus .fb{display:flex;gap:10px;width:100%;max-width:360px}

/* ---------- toast / xp / level ---------- */
.toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--sat) + 12px);z-index:90;transform:translate(-50%,-150%);transition:transform .35s var(--ease);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;width:max-content;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;line-height:1.5}
.toast.show{transform:translate(-50%,0)}
.xpf{position:fixed;z-index:85;pointer-events:none;font-family:var(--head);font-weight:700;font-size:18px;color:var(--gold);animation:xpf 1s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-12px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px)}}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none}
.levelup{position:fixed;inset:0;z-index:92;display:grid;place-items:center;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.levelup.open{opacity:1;pointer-events:auto}
.levelup .box{text-align:center;padding:28px 24px;border-radius:24px;background:var(--surface);width:min(330px,86vw);transform:scale(.8);transition:transform .4s var(--ease)}
.levelup.open .box{transform:scale(1)}
.levelup .e{font-size:68px}
.levelup h2{font-size:26px;margin-top:4px;color:var(--brand)}
.levelup p{color:var(--mute);margin:8px 0 18px;line-height:1.7}

/* ---------- onboarding ---------- */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--sat) + 30px) 24px calc(var(--sab) + 26px);overflow:auto}
.onb .pg{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;animation:enter .5s var(--ease)}
.onb .logo{font-family:var(--head);font-size:52px;font-weight:700;color:var(--brand);line-height:1.3}
.onb h2{font-size:25px;line-height:1.45;margin-bottom:8px}
.onb p{color:var(--mute);font-size:16px;line-height:1.8}
.onb .bubbles{margin:26px 0;display:flex;flex-direction:column;gap:10px}
.onb .bb{align-self:flex-start;max-width:86%;padding:11px 15px;border-radius:18px 18px 18px 4px;background:var(--surface);border:1.5px solid var(--line);font-size:15px;line-height:1.6;animation:enter .5s var(--ease) both}
.onb .bb.me{align-self:flex-end;border-radius:18px 18px 4px 18px;background:var(--brand);border-color:var(--brand);color:#fff}
.onb input.name{width:100%;height:58px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);padding:0 18px;font-size:20px;outline:none;margin-top:18px}
.onb input.name:focus{border-color:var(--brand)}
.onb .nextb{position:relative;height:58px;border-radius:16px;background:var(--brand);color:#fff;font-family:var(--head);font-size:18px;font-weight:700;box-shadow:0 5px 0 var(--brand-d);margin-top:16px;width:100%}
.onb .nextb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.onb .skip{position:relative;margin-top:12px;color:var(--mute);font-size:14px;width:100%;padding:8px}
.onb .pdots{position:relative;display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.onb .pdots i{width:8px;height:8px;border-radius:99px;background:var(--line2);transition:.3s}
.onb .pdots i.on{width:22px;background:var(--brand)}
.ios-steps{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.ios-steps div{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:15px;line-height:1.5}
.ios-steps b{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
.coach-pick{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.coach-pick button{display:flex;gap:14px;align-items:center;text-align:right;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.coach-pick button .e{font-size:32px}
.coach-pick button b{display:block;font-family:var(--head);font-size:16px}
.coach-pick button small{color:var(--mute);font-size:13px;line-height:1.5}
.coach-pick button.on{border-color:var(--brand);background:var(--brand-soft)}

.view{display:none}
.view.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-goals"></section>
  <section class="view" id="v-people"></section>
  <section class="view" id="v-me"></section>
</div>

<nav class="nav" id="nav">
  <button class="tab on" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>النهارده</button>
  <button class="tab" data-v="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>أهدافي</button>
  <button class="fab" id="fab" aria-label="فكرني">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
  </button>
  <button class="tab" data-v="people"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>ناسي</button>
  <button class="tab" data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>أنا</button>
</nav>

<!-- voice -->
<div class="voice" id="voice">
  <button class="x" id="vClose" aria-label="قفل">✕</button>
  <div class="hint" id="vHint"></div>
  <canvas id="orb" width="660" height="660"></canvas>
  <div class="state" id="vState"></div>
  <div class="live" id="vLive"></div>
  <div class="thinking" id="vThink"><div class="dotsl"><i></i><i></i><i></i></div><span id="vThinkT">ثانية بفهم</span></div>
  <div class="review" id="vReview"></div>
  <div class="typebox" id="vType"><textarea id="vText" rows="2" placeholder="اكتب هنا، أو دوس مايك الكيبورد واتكلم"></textarea><button id="vSend" class="chunky" aria-label="ابعت">⬅</button></div>
  <div class="review-actions" id="vActs"><button class="btn ghost" id="vRedo">قول تاني</button><button class="btn pri" id="vSave">احفظ</button></div>
  <div class="ctrls" id="vCtrls">
    <button class="vbtn" id="vKb" aria-label="كتابة">⌨️</button>
    <button class="vbtn main" id="vMic" aria-label="سجل">🎙</button>
    <button class="vbtn" id="vDone" aria-label="خلصت">✓</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="focus" id="focus"></div>
<div class="levelup" id="levelup"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<div id="onb"></div>

<script src="adhan.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
