<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>فكرني</title>
<meta name="description" content="قول وأنا أفتكر — نظّم يومك وأهدافك بصوتك">
<meta name="theme-color" content="#0D0A1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فكرني">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0A1C; --bg2:#141029; --card:#1B1636; --card2:#241D47; --card3:#2E2659;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#F5F2FF; --mute:#A59EC8; --dim:#6E6795;
  --a1:#FF8A3D; --a2:#FF3D8B; --violet:#8B5CFF; --blue:#4DA3FF;
  --mint:#33E0A1; --gold:#FFC94D; --red:#FF5A6E;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --grad2:linear-gradient(135deg,#8B5CFF,#FF3D8B);
  --r:20px; --r2:28px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.9,.25,1.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea,button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text}
.bg-glow{position:fixed;inset:-20% -20% auto;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(40% 50% at 80% 10%,rgba(139,92,255,.28),transparent 70%),
             radial-gradient(35% 40% at 15% 25%,rgba(255,61,139,.18),transparent 70%),
             radial-gradient(30% 35% at 50% 0%,rgba(255,138,61,.14),transparent 70%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 120px)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .hello{flex:1;min-width:0}
.top h1{font-size:22px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date{color:var(--mute);font-size:13px;margin-top:2px}
.chip-streak{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.3);font-weight:700;font-size:15px}
.chip-streak .fire{display:inline-block;animation:flick 1.6s ease-in-out infinite}
.chip-streak.cold{background:var(--card);border-color:var(--line2);filter:grayscale(1);opacity:.7}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
.lvl-av{position:relative;width:48px;height:48px;flex:none}
.lvl-av svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl-av .face{position:absolute;inset:6px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:20px}
.lvl-av .n{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--grad);font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;border:2px solid var(--bg)}

/* ---------- coach ---------- */
.coach{display:flex;gap:10px;align-items:flex-start;margin:4px 0 16px}
.coach .who{width:42px;height:42px;flex:none;border-radius:16px;background:var(--grad2);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px rgba(139,92,255,.35);animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.coach .bubble{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:11px 14px;font-size:14.5px;line-height:1.6;position:relative;cursor:pointer}
.coach .bubble small{display:block;color:var(--dim);font-size:11px;margin-top:4px}

/* ---------- progress card ---------- */
.daycard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:14px;overflow:hidden;position:relative}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;line-height:1}
.ring .v small{display:block;font-size:10px;color:var(--mute);font-weight:400;margin-top:3px}
.daycard .txt{flex:1}
.daycard .txt b{font-size:17px}
.daycard .txt p{color:var(--mute);font-size:13px;margin-top:4px;line-height:1.5}
.xpbar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .8s var(--ease)}
.xpline{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}

/* ---------- day strip ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:50px;padding:8px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;transition:.25s var(--ease)}
.dpill .w{font-size:11px;color:var(--mute)}
.dpill .d{font-size:17px;font-weight:600;margin-top:2px}
.dpill .dots{height:6px;display:flex;justify-content:center;gap:2px;margin-top:3px}
.dpill .dots i{width:4px;height:4px;border-radius:50%;background:var(--a2)}
.dpill .dots i.ok{background:var(--mint)}
.dpill.on{background:var(--grad);border-color:transparent;transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,61,139,.3)}
.dpill.on .w{color:rgba(255,255,255,.85)}
.dpill.on .dots i{background:#fff}

/* ---------- sections + task cards ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec h3{font-size:15px;font-weight:600;color:var(--mute);display:flex;gap:6px;align-items:center}
.sec .cnt{font-size:12px;background:var(--card2);padding:1px 8px;border-radius:99px;color:var(--text)}
.sec button{font-size:12.5px;color:var(--a1);font-weight:500}
.list{display:flex;flex-direction:column;gap:10px}
.task{position:relative;border-radius:var(--r);touch-action:pan-y}
.task .under{position:absolute;inset:0;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:600;font-size:14px;overflow:hidden}
.task .under .l,.task .under .r{opacity:0;transition:opacity .15s}
.task .under.done{background:linear-gradient(90deg,rgba(51,224,161,.05),rgba(51,224,161,.35));color:var(--mint)}
.task .under.snz{background:linear-gradient(270deg,rgba(255,201,77,.05),rgba(255,201,77,.3));color:var(--gold)}
.task .card{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;transition:transform .35s var(--ease),opacity .3s,background .2s;will-change:transform}
.task .card:active{background:var(--card2)}
.task .emo{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card2)}
.task .body{flex:1;min-width:0}
.task .ttl{font-size:15.5px;font-weight:500;line-height:1.45;word-break:break-word}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--mute);display:inline-flex;gap:4px;align-items:center}
.tag.time{color:var(--text);background:rgba(139,92,255,.18)}
.tag.late{color:#fff;background:rgba(255,90,110,.25)}
.tag.big{color:var(--gold);background:rgba(255,201,77,.13)}
.tag.rep{color:var(--blue);background:rgba(77,163,255,.13)}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:.25s var(--ease)}
.chk svg{opacity:0;transform:scale(.4);transition:.3s var(--ease)}
.task.is-done .chk{background:var(--mint);border-color:var(--mint)}
.task.is-done .chk svg{opacity:1;transform:scale(1)}
.task.is-done .card{opacity:.55}
.task.is-done .ttl{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.task.overdue .card{border-color:rgba(255,90,110,.35);background:linear-gradient(90deg,var(--card),rgba(255,90,110,.08))}
.task.now .card{border-color:rgba(255,138,61,.55);box-shadow:0 0 0 3px rgba(255,138,61,.12)}
.task.pop .card{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.task.enter{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.mini-steps{margin-top:6px;height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.mini-steps i{display:block;height:100%;background:var(--gold)}

.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,61,139,.14),rgba(139,92,255,.12));border:1px solid rgba(255,61,139,.25);margin-bottom:10px}
.nudge .e{font-size:24px}
.nudge .t{flex:1;font-size:14px;line-height:1.5}
.nudge button{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;white-space:nowrap}

.empty{text-align:center;padding:34px 20px;border:1.5px dashed var(--line2);border-radius:var(--r2);color:var(--mute);line-height:1.7}
.empty .big{font-size:46px;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
.empty .ex{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:14px;background:var(--card);font-size:13px;color:var(--text)}

/* ---------- goals ---------- */
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.goal .gl{flex:1;min-width:0}
.goal h4{font-size:16px;font-weight:600}
.goal p{font-size:12.5px;color:var(--mute);margin-top:3px}
.goal .dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.goal .dots i{width:16px;height:16px;border-radius:6px;background:rgba(255,255,255,.07);transition:.3s var(--ease)}
.goal .dots i.on{background:var(--grad);transform:scale(1.05)}
.goal .plus{width:56px;height:56px;flex:none;border-radius:20px;background:var(--grad);font-size:26px;font-weight:700;display:grid;place-items:center;box-shadow:0 10px 26px rgba(255,61,139,.35);transition:transform .2s var(--ease)}
.goal .plus:active{transform:scale(.88)}
.goal.complete{border-color:rgba(51,224,161,.4)}
.goal.complete .plus{background:var(--mint);box-shadow:0 10px 26px rgba(51,224,161,.3)}
.goal .ring{width:62px;height:62px}
.goal .ring .v{font-size:15px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:right;transition:.2s}
.tpl:active{transform:scale(.97)}
.tpl .e{font-size:26px}
.tpl b{display:block;font-size:14px;margin-top:6px;font-weight:600}
.tpl small{color:var(--mute);font-size:11.5px}

/* ---------- people ---------- */
.person{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;display:flex;align-items:center;gap:12px}
.person .av{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card2);position:relative}
.person .av::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--st,var(--mint))}
.person .pl{flex:1;min-width:0}
.person h4{font-size:16px;font-weight:600}
.person p{font-size:12.5px;color:var(--mute);margin-top:2px}
.person .warm{height:5px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.person .warm i{display:block;height:100%;border-radius:99px;background:var(--st,var(--mint));transition:width .6s var(--ease)}
.person .called{padding:10px 12px;border-radius:14px;background:rgba(51,224,161,.14);color:var(--mint);font-size:13px;font-weight:600;white-space:nowrap}
.person .called:active{transform:scale(.94)}

/* ---------- me ---------- */
.hero{text-align:center;padding:22px 16px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r2);position:relative;overflow:hidden}
.hero .bigav{width:110px;height:110px;margin:0 auto 10px;position:relative}
.hero .bigav .face{position:absolute;inset:10px;border-radius:50%;background:var(--card3);display:grid;place-items:center;font-size:44px}
.hero .bigav svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero h2{font-size:22px}
.hero .title{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:99px;background:var(--grad);font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:var(--mute);margin-top:2px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.06)}
.heat i.l1{background:rgba(255,138,61,.35)}.heat i.l2{background:rgba(255,100,100,.6)}.heat i.l3{background:var(--a2)}.heat i.l4{background:#ff7ab0;box-shadow:0 0 8px rgba(255,61,139,.6)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.badge .e{font-size:30px}
.badge b{display:block;font-size:12px;margin-top:4px;font-weight:600}
.badge small{display:block;font-size:10.5px;color:var(--mute);margin-top:2px;line-height:1.4}
.badge.locked .e{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--dim)}
.badge.got{border-color:rgba(255,201,77,.35);background:linear-gradient(160deg,rgba(255,201,77,.1),var(--card))}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:right;font-size:15px;margin-bottom:8px}
.rowbtn .e{font-size:20px}
.rowbtn span{flex:1}
.rowbtn small{color:var(--mute);font-size:12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;text-align:center;line-height:1.5}
.seg button .e{display:block;font-size:24px}
.seg button.on{border-color:var(--a2);background:rgba(255,61,139,.12)}

/* ---------- nav + fab ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);width:min(488px,calc(100% - 24px));z-index:20;display:flex;align-items:center;justify-content:space-around;height:70px;border-radius:26px;background:rgba(27,22,54,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--dim);padding:8px 0;transition:color .2s}
.nav .tab .i{font-size:21px;filter:grayscale(1);opacity:.6;transition:.25s var(--ease)}
.nav .tab.on{color:var(--text)}
.nav .tab.on .i{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.fab{width:72px;height:72px;margin-top:-34px;flex:none;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 34px rgba(255,61,139,.55),0 0 0 6px var(--bg);position:relative;transition:transform .2s var(--ease)}
.fab:active{transform:scale(.9)}
.fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,61,139,.45);animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.fab svg{width:30px;height:30px}

/* ---------- voice overlay ---------- */
.voice{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 100%,#2a1550 0%,#0D0A1C 60%);display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 24px);opacity:0;pointer-events:none;transition:opacity .3s}
.voice.open{opacity:1;pointer-events:auto}
.voice .x{position:absolute;top:calc(var(--sat) + 14px);left:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px}
.voice .hint{color:var(--mute);font-size:14px;margin-top:40px;text-align:center;min-height:44px;transition:opacity .4s;line-height:1.6;padding:0 30px}
.voice .hint b{color:var(--text);font-weight:500}
#orb{width:min(78vw,330px);height:min(78vw,330px);margin:18px 0 6px;cursor:pointer}
.voice .live{font-size:21px;line-height:1.7;text-align:center;min-height:110px;max-height:30vh;overflow:auto;width:100%;padding:0 6px;font-weight:500}
.voice .live .interim{color:var(--mute)}
.voice .state{font-size:13px;color:var(--a1);margin-top:4px;letter-spacing:.3px;height:20px}
.voice .ctrls{margin-top:auto;display:flex;gap:16px;align-items:center;justify-content:center;width:100%}
.vbtn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:22px;border:1px solid var(--line2)}
.vbtn.main{width:78px;height:78px;background:var(--grad);border:0;font-size:28px;box-shadow:0 14px 34px rgba(255,61,139,.5)}
.vbtn.main.rec{background:#fff;color:var(--a2)}
.typebox{width:100%;display:none;gap:8px;margin-top:10px}
.typebox.show{display:flex}
.typebox textarea{flex:1;min-height:56px;max-height:140px;resize:none;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.06);padding:14px 16px;font-size:16px;outline:none;line-height:1.5}
.typebox textarea:focus{border-color:var(--a2)}
.typebox button{width:56px;border-radius:18px;background:var(--grad);font-size:22px}

/* review */
.review{width:100%;flex:1;overflow:auto;display:none;flex-direction:column;gap:10px;padding:8px 2px 14px;margin-top:8px}
.review.show{display:flex}
.review .said{font-size:13px;color:var(--mute);background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;line-height:1.6}
.review .reply{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:center}
.rcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:12px;animation:fly .6s var(--ease) both}
@keyframes fly{from{opacity:0;transform:translateY(30px) scale(.9) rotate(-2deg)}to{opacity:1;transform:none}}
.rcard .emo{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.rcard .b{flex:1;min-width:0}
.rcard input.t{width:100%;background:transparent;border:0;outline:none;font-size:16px;font-weight:500;padding:2px 0;border-bottom:1px dashed transparent}
.rcard input.t:focus{border-bottom-color:var(--line2)}
.rcard .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rcard .meta label{position:relative}
.rcard .meta input[type=date],.rcard .meta input[type=time]{position:absolute;inset:0;opacity:0;width:100%}
.rcard .del{width:34px;height:34px;border-radius:50%;background:rgba(255,90,110,.12);color:var(--red);font-size:16px;flex:none}
.review-actions{display:none;gap:10px;width:100%}
.review-actions.show{display:flex}
.btn{flex:1;height:56px;border-radius:18px;background:var(--card2);font-weight:600;font-size:16px;border:1px solid var(--line2)}
.btn.pri{background:var(--grad);border:0;box-shadow:0 12px 30px rgba(255,61,139,.35)}
.btn.ghost{background:transparent}
.thinking{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:20px;color:var(--mute)}
.thinking.show{display:flex}
.dotsl{display:flex;gap:6px}.dotsl i{width:10px;height:10px;border-radius:50%;background:var(--a2);animation:dl 1s infinite}
.dotsl i:nth-child(2){animation-delay:.15s;background:var(--violet)}.dotsl i:nth-child(3){animation-delay:.3s;background:var(--a1)}
@keyframes dl{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,3,14,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:min(520px,100%);max-height:88vh;overflow:auto;transform:translate(-50%,105%);transition:transform .45s var(--ease);background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 18px calc(var(--sab) + 20px)}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{cursor:pointer;width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);outline:none;font-size:16px}
.field textarea{height:80px;padding:12px 14px;resize:none}
.field input:focus,.field select:focus{border-color:var(--a2)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.act{height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line2);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.act.pri{background:var(--grad);border:0;font-weight:600}
.act.warn{color:var(--red)}
.act.full{grid-column:1/-1}
.steps{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.step{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.step .c{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:13px}
.step.d .c{background:var(--gold);border-color:var(--gold);color:#221}
.step.d span{text-decoration:line-through;color:var(--mute)}
.step span{flex:1;font-size:14px}
.step small{color:var(--mute);font-size:11px}
.emoji-pick{display:flex;gap:6px;flex-wrap:wrap}
.emoji-pick button{width:42px;height:42px;border-radius:12px;background:var(--card);font-size:20px;border:1px solid var(--line)}
.emoji-pick button.on{border-color:var(--a2);background:rgba(255,61,139,.15)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{padding:9px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px}
.choice button.on{border-color:var(--a2);background:rgba(255,61,139,.15)}

/* ---------- focus ---------- */
.focus{position:fixed;inset:0;z-index:70;background:radial-gradient(100% 70% at 50% 30%,#2a1550,#0D0A1C 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;opacity:0;pointer-events:none;transition:opacity .35s}
.focus.open{opacity:1;pointer-events:auto}
.focus .ft{font-size:20px;font-weight:600;text-align:center;line-height:1.5}
.focus .fs{color:var(--mute);font-size:14px;text-align:center}
.focus .clock{position:relative;width:250px;height:250px}
.focus .clock svg{transform:rotate(-90deg)}
.focus .clock .v{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:300;direction:ltr;font-variant-numeric:tabular-nums}
.focus .fb{display:flex;gap:10px;width:100%;max-width:360px}

/* ---------- toast / xp / level ---------- */
.toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--sat) + 12px);z-index:90;transform:translate(-50%,-140%);transition:transform .45s var(--ease);background:rgba(36,29,71,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);padding:12px 18px;border-radius:18px;font-size:14.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center}
.toast.show{transform:translate(-50%,0)}
.xpf{position:fixed;z-index:85;pointer-events:none;font-weight:700;font-size:18px;color:var(--gold);text-shadow:0 2px 12px rgba(255,201,77,.6);animation:xpf 1.1s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none}
.levelup{position:fixed;inset:0;z-index:92;display:grid;place-items:center;background:rgba(5,3,14,.75);opacity:0;pointer-events:none;transition:opacity .3s}
.levelup.open{opacity:1;pointer-events:auto}
.levelup .box{text-align:center;padding:30px 26px;border-radius:32px;background:linear-gradient(160deg,var(--card3),var(--card));border:1px solid var(--line2);width:min(330px,86vw);transform:scale(.7);transition:transform .5s var(--ease)}
.levelup.open .box{transform:scale(1)}
.levelup .e{font-size:74px;animation:bob 2s ease-in-out infinite}
.levelup h2{font-size:26px;margin-top:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.levelup p{color:var(--mute);margin:8px 0 18px;line-height:1.6}

/* ---------- onboarding ---------- */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--sat) + 30px) 24px calc(var(--sab) + 26px);overflow:auto}
.onb .bg-glow{position:absolute}
.onb .pg{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;animation:enter .6s var(--ease)}
.onb .logo{font-size:56px;font-weight:700;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.onb h2{font-size:26px;line-height:1.4;margin-bottom:10px}
.onb p{color:var(--mute);font-size:16px;line-height:1.75}
.onb .bubbles{margin:26px 0;display:flex;flex-direction:column;gap:10px}
.onb .bb{align-self:flex-start;max-width:85%;padding:12px 16px;border-radius:18px 18px 18px 6px;background:var(--card2);font-size:15px;line-height:1.5;animation:enter .6s var(--ease) both}
.onb .bb.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--grad)}
.onb input.name{width:100%;height:60px;border-radius:18px;border:1px solid var(--line2);background:var(--card);padding:0 18px;font-size:20px;outline:none;margin-top:18px}
.onb input.name:focus{border-color:var(--a2)}
.onb .nextb{position:relative;height:60px;border-radius:20px;background:var(--grad);font-size:18px;font-weight:600;box-shadow:0 14px 34px rgba(255,61,139,.4);margin-top:16px;width:100%}
.onb .skip{position:relative;margin-top:12px;color:var(--mute);font-size:14px;width:100%;padding:8px}
.onb .pdots{position:relative;display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.onb .pdots i{width:8px;height:8px;border-radius:99px;background:var(--line2);transition:.3s}
.onb .pdots i.on{width:24px;background:var(--a2)}
.ios-steps{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.ios-steps div{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px;font-size:15px}
.ios-steps b{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;font-size:14px}
.coach-pick{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.coach-pick button{display:flex;gap:14px;align-items:center;text-align:right;padding:14px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.coach-pick button .e{font-size:34px}
.coach-pick button b{display:block;font-size:16px}
.coach-pick button small{color:var(--mute);font-size:13px;line-height:1.5}
.coach-pick button.on{border-color:var(--a2);background:rgba(255,61,139,.1)}

.view{display:none}
.view.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div id="app">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-goals"></section>
  <section class="view" id="v-people"></section>
  <section class="view" id="v-me"></section>
</div>

<nav class="nav" id="nav">
  <button class="tab on" data-v="today"><span class="i">☀️</span>النهارده</button>
  <button class="tab" data-v="goals"><span class="i">🎯</span>أهدافي</button>
  <button class="fab" id="fab" aria-label="فكرني">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
  </button>
  <button class="tab" data-v="people"><span class="i">❤️</span>ناسي</button>
  <button class="tab" data-v="me"><span class="i">🏆</span>أنا</button>
</nav>

<!-- voice -->
<div class="voice" id="voice">
  <button class="x" id="vClose" aria-label="قفل">✕</button>
  <div class="hint" id="vHint"></div>
  <canvas id="orb" width="660" height="660"></canvas>
  <div class="state" id="vState"></div>
  <div class="live" id="vLive"></div>
  <div class="thinking" id="vThink"><div class="dotsl"><i></i><i></i><i></i></div><span>بفهم كلامك…</span></div>
  <div class="review" id="vReview"></div>
  <div class="typebox" id="vType"><textarea id="vText" rows="2" placeholder="اكتب أو دوس 🎙 اللي في الكيبورد… فكرني بكرة الساعة ٣…"></textarea><button id="vSend" aria-label="ابعت">⬅</button></div>
  <div class="review-actions" id="vActs"><button class="btn ghost" id="vRedo">🎙 تاني</button><button class="btn pri" id="vSave">تمام، ضيفهم ✓</button></div>
  <div class="ctrls" id="vCtrls">
    <button class="vbtn" id="vKb" aria-label="كتابة">⌨️</button>
    <button class="vbtn main" id="vMic" aria-label="سجل">🎙</button>
    <button class="vbtn" id="vDone" aria-label="خلصت">✓</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="focus" id="focus"></div>
<div class="levelup" id="levelup"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<div id="onb"></div>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
